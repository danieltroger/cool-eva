name: TypeCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The Grafana code-table check used to be a second step here. It now runs inside
      # `npm test` (scripts/run-checks.ts, gated by test.yml) along with every other
      # self-check, so this job is tsc and nothing else: one list of what guards the
      # repo, rather than two that can disagree about it.
