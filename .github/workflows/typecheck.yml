name: TypeCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The Grafana trouble-codes dashboard embeds the DTC table as SQL, because
      # Grafana can only read the ride log. Nothing about a stale copy is visible on
      # screen — a wrong code name renders as confidently as a right one — so the
      # only way it gets noticed is here. See scripts/generate-grafana-dtc.ts.
      - name: Grafana code table matches src/diagnostics/dtc-table.ts
        run: npm run check:grafana-dtc
