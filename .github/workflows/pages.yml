name: Dashboard on GitHub Pages

# Publishes public/ as-is to GitHub Pages, so there is an https copy of the dashboard for
# Web Bluetooth to run on. The Pi's own copy is plain http, and Web Bluetooth refuses an
# insecure origin outright, so the Pi cannot serve the page that talks to it over BLE.
# The https copy has no Pi behind it and so talks only BLE (public/lib/ble-link.js
# BLE_MODE). No build step: what is committed is what runs, the same as on the Pi.
# docs/ble-server.md §"Where the page comes from".
#
# ⚠️ Repo Settings → Pages → Source must be "GitHub Actions" for the deploy step to work.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
