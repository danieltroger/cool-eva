name: Dashboard on GitHub Pages

# Publishes public/ as-is to https://cool-eva.athegen.com, the HTTPS copy Web Bluetooth needs:
# the Pi serves plain http, and Web Bluetooth refuses an insecure origin. That copy has no Pi
# behind it and talks only BLE (public/lib/ble-link.js BLE_MODE). No build step.
# One-time repo setup (Pages source, custom domain, DNS): docs/hosted-pages.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
