# DISABLED 2026-08-19. Reviews now run locally instead — see REVIEWING.md.
#
# This workflow billed ANTHROPIC_API_KEY per run and cost about €50 in a single
# day of active development. The same reviews run on the maintainer's existing
# subscription for nothing, so the spend bought nothing that was not already
# available.
#
# It is disabled in TWO places on purpose, because either alone is a trap:
#
#   • `gh workflow disable "Claude Code"` — takes effect immediately, but it is a
#     repository SETTING with no trace in the tree. A fresh clone shows a
#     workflow that looks live, and anyone re-enabling it in the UI gets no hint
#     that it costs money.
#   • the `if: false` guards below — visible to anyone reading the repo, and they
#     survive the setting being flipped back.
#
# To turn it back on: remove the `if: false` lines AND run
# `gh workflow enable "Claude Code"`. Be deliberate about it; it bills per run
# and fires on every PR open.
#
# The reviews themselves were genuinely valuable and are NOT being dropped — they
# caught several real bugs, including a liveness summary that would have reported
# a dead CAN bus as healthy. What changed is only where they run. Running them
# locally is also strictly better in one respect the CI reviewer kept flagging
# itself: it could not execute anything, and repeatedly had to write "I could not
# run the tests here, so the passing run remains your report". A local reviewer
# runs the suite and can re-measure a data claim against the capture archive.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Auto-review on PR creation
  auto-review:
    if: false # DISABLED — see the header. Was: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: openclaw-depict[bot]
          timeout_minutes: 10
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  # Interactive mode for @claude mentions
  claude:
    if: false # DISABLED — see the header. The original condition is kept below.
    # (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
    # (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
    # (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
    # (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-opus-5
