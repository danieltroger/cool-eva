name: Native installer diagnosis

on:
  pull_request:
    paths: [.github/workflows/installer-native-diagnosis.yml]

permissions:
  contents: read
  actions: read

jobs:
  native-control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Probe the original ARM64 artifact without TCG or the proposed runtime guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo 'From Daniel’s AI agent. Native comparison; no retry and no runtime mitigation.'
          gh run download 41820810594 --repo danieltroger/cool-eva --name unverified-bundle-arm64-262e00ec7f8c9cb869b14a2cecc8281a4a28314c --dir dist/native-control
          awk -F= '/^sha256=/ {print $2 "  dist/native-control/bundle.tar.zst"}' dist/native-control/manifest.txt | sha256sum --check
          mkdir -p dist/native-control/payload
          tar --zstd -xf dist/native-control/bundle.tar.zst -C dist/native-control/payload
          cd dist/native-control/payload
          uname -smr
          lscpu | sed -n '1,15p'
          getconf PAGESIZE
          sha256sum runtime/bin/node
          runtime/bin/node --version
          for iteration in $(seq 1 100); do
            echo "Unmitigated native import $iteration/100 starting (60-second limit)"
            timeout --signal=KILL 60 runtime/bin/node --experimental-strip-types --input-type=module --eval "await import('./src/install/main.ts')"
          done
          echo 'All 100 unmitigated native imports passed.'
