<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cool Eva</title>
    <!-- Copied from public/index.html, where its comment explains the cost on the bike. Here it
         buys something else: without it Chrome's automatic /favicon.ico request is a console
         error on every load (an "unsafe attempt to load URL" over file://), and "the console is
         clean" has to be a gate somebody can actually read. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🧊</text></svg>"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f172a;
      }
    </style>
    <style>
__CSS__
    </style>
    <style>

      .pv-toast {
        position: fixed;
        left: 50%;
        bottom: 1.2rem;
        transform: translateX(-50%);
        max-width: min(22rem, calc(100vw - 2rem));
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--tile-edge);
        border-radius: 0.7rem;
        background: rgba(30, 41, 59, 0.97);
        color: var(--fg);
        font-size: 0.78rem;
        z-index: 100;
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }

      .pv-toast.on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- The dashboard as it actually runs, with the Raspberry Pi stood in for. The
         stylesheet and every module below are the shipped ones; only `fetch`,
         `WebSocket` and `location` are substituted, so what the page LOOKS like is
         what the bike serves. Built by scripts/build-service-preview.ts. -->
    <div class="pv-toast" id="pv-toast"></div>
    <script>
      // Generated from the repo's own tables by scripts/build-service-preview.ts.
      const __TABLES = __TABLES__;

      // The numbers and prose the Pi owns — the fan's policy, the charge controller's reason codes
      // and their sentences, the WebSocket heartbeat — injected by the same builder rather than
      // written out again here. See its comment for why a second copy is the failure, not the fix.
      const SERVER = __SERVER_FACTS__;

      /**
       * ⚠️ ONE gate object, referenced from every fixture that carries one, and declared HERE
       * because `const` has a temporal dead zone and the fixtures below are built at parse
       * time — putting it beside the scene that mutates it rendered a blank page.
       *
       * The scene overlay used to patch two of the five gate literals, so `?scene=refused`
       * showed a refused write panel above a lifetime panel and probe answers still claiming
       * the bike was fine: two opinions from one bike on one screen, in the instrument that
       * gates dashboard merges. Mutated in place below, since the fixtures hold a reference.
       */
      const GATE = { safe: true, blockers: [], chargingEvidence: null, checks: [] };

      const __MODULES = {
__MODULES__
      };

      // The file may be opened straight off a disk, where nothing has set a viewport and
      // iOS would lay it out at 980 px and shrink it. Idempotent: a host that already
      // provides one wins.
      if (!document.querySelector('meta[name="viewport"]')) {
        const meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, initial-scale=1, viewport-fit=cover";
        (document.head || document.documentElement).appendChild(meta);
      }

      // ── what a tap would have done ───────────────────────────────────────────────

      let toastTimer = 0;
      function toast(text) {
        const node = document.getElementById("pv-toast");
        if (!node) {
          return;
        }
        node.textContent = text;
        node.classList.add("on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => node.classList.remove("on"), 3200);
      }

      // Two controls in the sheet hand the file to the browser by navigating — the ride log
      // and the parameter export. A shadowed `location` inside those modules (see the
      // bundler) turns the navigation into this, so a tap says what it would have done
      // instead of blanking the page.
      const __previewLocation = {
        protocol: "http:",
        host: "eva.local",
        pathname: "/",
        search: "",
        // ⚠️ The router reads location.hash and the annotated harness never ran the
        // router — it mounted views directly — so this was missing and the whole app
        // died on startRouting with "Cannot read properties of undefined". Delegated to
        // the real hash so the tab bar works and the back button does what it does on
        // the Pi; a preview where you cannot change tab is not a preview of the app.
        get hash() {
          return window.location.hash;
        },
        set hash(next) {
          window.location.hash = next;
        },
        get href() {
          return `http://eva.local/${window.location.hash}`;
        },
        set href(target) {
          toast(`Preview — this would download ${target} from the Pi.`);
        },
      };
      window.__previewLocation = __previewLocation;

      // The one real link in the sheet ("Open the full parameter table →"). Captured rather
      // than rewritten, so the anchor the design uses is the anchor that renders.
      document.addEventListener(
        "click",
        event => {
          const anchor = event.target instanceof Element ? event.target.closest("a[href]") : null;
          // ⚠️ NOT filtered on .pv-stage here: that class exists only in the annotated
          // template, so the filter silently matched nothing and "Open the full parameter
          // table →" navigated straight out of the preview to a file:// 404.
          if (anchor) {
            event.preventDefault();
            toast(`Preview — this would open ${anchor.getAttribute("href")} on the Pi.`);
          }
        },
        true
      );

      // ── this bike ────────────────────────────────────────────────────────────────
      //
      // Numbers from the Ribelle rather than placeholders: the sweep read 233 of 277
      // parameters seventeen minutes ago, MAX_DC_CHG_CURRENT holds 75, both micros name
      // parameter table 16407, and the stored codes include the water-pump open circuit
      // that has been there since before anyone started looking.

      const NOW = Date.now();
      const MINUTE = 60 * 1000;
      const DAY = 24 * 60 * MINUTE;
      const SWEPT_AT = NOW - 17 * MINUTE;

      const SWEPT = {
        MAX_DC_CHG_CURRENT: { value: 75, rawHex: "4B", label: "75 A", readAt: SWEPT_AT, complete: true },
        FCHG_CURRENT_GAIN: {
          value: 225,
          rawHex: "00E1",
          label: "225 (raw — the unit is not known)",
          readAt: SWEPT_AT,
          complete: true,
        },
        TORQUE_LIMIT: { value: 2300, rawHex: "08FC", label: "230.0 Nm", readAt: SWEPT_AT, complete: true },
        REGEN_TORQUE_LIMIT: { value: 600, rawHex: "0258", label: "60.0 Nm", readAt: SWEPT_AT, complete: true },
        VSM_CONFIG_1: { value: 0x1113, rawHex: "1113", label: "0x1113", readAt: SWEPT_AT, complete: true },
      };

      const TARGETS = [
        {
          name: "MAX_DC_CHG_CURRENT",
          index: 258,
          micro: "A9",
          purpose:
            "The DC fast-charge current this bike advertises to a charger, in amperes. Reads 75. Energica's own 60/75/80 A options write this parameter and nothing else, so 80 is a value the factory shipped.",
          warnings: [
            "⚠️ It will probably do nothing. Across eight logged DC sessions the ceiling is the STATION, not the bike: station identity explains 84 % of the variance, the highest ever delivered is 73.2 A, and no station has offered even the 75 A already permitted.",
            "⚠️ 80 A is 1.25C for this pack. The cell datasheet allows 1.10C = 70.4 A, and only between 25 and 35 °C — and the VCU is shown 35 °C while the pack is really at 44-54 °C, so 91 % of DC charging time above 30 A is already over the cell's fast-charge ceiling.",
            "Free check afterwards, no charger needed: 0x625 b2 is the configured max DC current and is broadcast on a merely-awake bike. It should change from 0x4B to 0x50.",
            "A dealer visit reverts it. The service tool reinstalls parameter values from Energica's server, keyed by VIN.",
          ],
          control: { kind: "number", min: 0, max: 80, minLabel: "0 A", maxLabel: "80 A" },
          verify:
            "Free check, no charger needed: 0x625 b2 is the configured max DC current and is broadcast on a merely-awake bike.",
          onBike: SWEPT.MAX_DC_CHG_CURRENT,
        },
        {
          name: "FCHG_CURRENT_GAIN",
          index: 259,
          micro: "A9",
          purpose:
            "An EVSE-block scalar whose meaning has never been established. Reads 225. Absent from Energica's tooling entirely — no option, no label, no range, no code path.",
          warnings: ["⚠️⚠️ THE DIRECTION OF EFFECT IS UNKNOWN.", "Change ONE parameter per charge session."],
          control: { kind: "number", min: 0, max: 512, minLabel: "0 (raw)", maxLabel: "512 (raw)" },
          verify: "No broadcast field carries this one, so the read-back above is the only confirmation.",
          onBike: SWEPT.FCHG_CURRENT_GAIN,
        },
        {
          name: "TORQUE_LIMIT",
          index: 48,
          micro: "A9",
          purpose: "The drive torque ceiling, 0.1 Nm per count. Reads 230.0 Nm.",
          warnings: ["⚠️ Raising this raises what the bike will deliver at full throttle."],
          control: { kind: "number", min: 0, max: 2760, minLabel: "0.0 Nm", maxLabel: "276.0 Nm" },
          verify: "Nothing broadcasts this, so the read-back above is the only confirmation.",
          onBike: SWEPT.TORQUE_LIMIT,
        },
        {
          name: "REGEN_TORQUE_LIMIT",
          index: 49,
          micro: "A9",
          purpose: "The regenerative braking torque ceiling, 0.1 Nm per count. Reads 60.0 Nm.",
          warnings: ["⚠️ REGEN_MAP0..3_TRQ (63-66) are almost certainly PERCENTAGES of this limit."],
          control: { kind: "number", min: 0, max: 900, minLabel: "0.0 Nm", maxLabel: "90.0 Nm" },
          verify: "Nothing broadcasts this either — the read-back above is the confirmation.",
          onBike: SWEPT.REGEN_TORQUE_LIMIT,
        },
        {
          name: "VSM_CONFIG_1",
          index: 16,
          micro: "A9",
          purpose:
            "The VCU's option word. Only the heated-handlebar bit is offered here; the same word also carries the PSU type and the Bluetooth variant.",
          warnings: [
            "⚠️ The whole word is NOT writable through this repo, on purpose.",
            "⚠️ A successful write does NOT mean the feature turned on. See the bit's own note.",
            "This changes a flag, not wiring. There is no heated-grip circuit on this bike unless one was fitted.",
          ],
          control: {
            kind: "bits",
            bits: [
              {
                key: "heated-handlebars",
                mask: 4,
                label: "Heated handlebars",
                caveat:
                  "Energica's option OP0024 sets exactly this bit and nothing else — but activation is normally granted per-VIN on Energica's server. Config words are only read at boot: key-cycle before judging it.",
              },
            ],
          },
          verify: "⚠️ Config words are only read at BOOT: key-cycle the bike before judging it.",
          onBike: SWEPT.VSM_CONFIG_1,
        },
      ];

      /** The journal, newest first — the record of what has been done to this motorcycle. */
      const JOURNAL = [
        {
          at: NOW - 2 * DAY,
          clockTrustworthy: true,
          action: "read-service-stamp",
          status: "read",
          before: "2000-01-01T00:00:00.000Z",
          after: 0,
        },
        {
          at: NOW - 9 * DAY,
          clockTrustworthy: true,
          action: "parameter-write",
          name: "MAX_DC_CHG_CURRENT",
          before: 80,
          after: 75,
          status: "written",
        },
        { at: NOW - 26 * DAY, clockTrustworthy: false, action: "clear-dtcs", status: "cleared" },
      ];

      const WRITE_STATUS = {
        enabled: true,
        // ⚠️ Both of these were missing until 2026-09-08, and the first one is why this file now
        // has a check of its own: views/vcu-write.js destructures `runningVersion`, so the binding
        // threw, the section froze on Availability()'s "waiting for an answer" ellipsis, and the
        // safety-gate line and ⚙️ Running were absent from twelve days of screenshots. A FIXED
        // label rather than this checkout's real commit: a review instrument whose text — and
        // whose amber +dirty colour — changed with the reader's git state would be worse.
        runningVersion: { commit: "7f6dbcd", dirty: false, trustworthy: true, label: "7f6dbcd" },
        // Null is "nothing commanded this session", which is the honest answer off a charge. The
        // DC scene replaces it with a settled verdict, since that is the line #153 added.
        chargeAck: null,
        // ⚠️ No `readings` here. It is on ServiceGateEvidence, the gate's INPUT, and never on the
        // verdict the Pi sends — one of three fields the fixture had invented.
        gate: GATE,
        tableGate: {
          state: "confirmed",
          writesAllowed: true,
          noReadWillHelp: false,
          reason: "Both micros name table 16407, which is a table this software carries.",
          remedy: "",
          outstanding: [],
          tableType: 16407,
        },
        // ⚠️ PiClockVerdict is a UNION, and `reasons` belongs to its untrustworthy arm alone. A
        // trustworthy verdict carrying an empty `reasons` is a shape the Pi cannot produce.
        clock: {
          trustworthy: true,
          iso: new Date(NOW).toISOString(),
          offsetFromGpsSeconds: 0.2,
        },
        targets: TARGETS,
        recent: JOURNAL,
        busHeldBy: null,
      };

      /**
       * What a lifetime-statistics read answers with (#177), in the shape src/http/lifetime-read.ts
       * serves. `measurement` is the Pi timing ITSELF during the read — how late its flow control
       * was, and the worst event-loop delay over the exchange — so a preview with no bus cannot
       * have measured one. The numbers here are this fixture's own; the SENTENCE is the shape
       * describeMeasurement() builds, so the panel is laid out as a real answer lays it out.
       */
      const LIFETIME_READ = {
        measurement: "flow control 2.4 ms after the kernel saw the First Frame · worst event-loop delay 1.8 ms",
        answered: 2,
        message: null,
        gate: GATE,
      };

      const STATUS = {
        uptimeSeconds: 4173,
        waypoints: 4,
        log: { files: 13, bytes: 4812442, enabled: true },
        groups: {
          battery: [17, 46],
          cells: [81, 81],
          charge: [8, 8],
          coolant: [4, 4],
          drive: [11, 11],
          gps: [9, 9],
          obd: [6, 6],
        },
      };

      /**
       * The last parameter sweep, and any sweep started from the preview.
       *
       * Shared across panels because there is one bike: a sweep started in the full-sheet
       * panel is the same sweep every other panel would be watching.
       */
      const READ_STATE = {
        // ⚠️ No `expected` on a finished sweep: VcuReadState's `finished` arm does not carry it,
        // only `running` does. Nothing on screen changes — views/service-mode.js reads it in the
        // running branch alone — which is exactly why it sat here unnoticed.
        run: {
          phase: "finished",
          startedAt: SWEPT_AT,
          finishedAt: SWEPT_AT + 41000,
          complete: true,
          tally: {
            total: 277,
            read: 233,
            // ⚠️ All seven, because tallyOf() seeds every status at 0 (src/vcu/read-runner.ts) —
            // the Pi never sends a partial one, and views/service-mode.js reads the record.
            byStatus: { "read": 233, "refused": 30, "no-response": 14, "no-session": 0, "multi-frame": 0, "unrecognised": 0, "not-sent": 0 },
            micros: [
              { micro: "A9", read: 201, failed: 22 },
              { micro: "A8", read: 32, failed: 22 },
            ],
          },
        },
        gate: GATE,
        enabled: true,
        export: { rows: 233, readAt: SWEPT_AT, complete: true },
        message: null,
      };

      // ── the bike on the wire ─────────────────────────────────────────────────────
      //
      // `[value, unit, group]`, and optionally the moment it was recorded. Left off, a reading is
      // stamped when the message carrying it goes out — which is what src/can/signals.ts's
      // record() does for anything whose frame keeps arriving, and why a parked bike's tiles do
      // not dim. Given, the reading is an EVENT: the waypoint trio keeps the moment it was saved,
      // because views/trip-stats.js PRINTS that time, and re-stamping it would walk the clock in
      // the Waypoints tile forward by five seconds every five seconds.

      const PARKED_SIGNALS = {
        "soc": [58, "%", "battery"],
        "pack_v": [346.8, "V", "battery"],
        "pack_kw": [0.1, "kW", "battery"],
        "cell_min_mv": [3612, "mV", "cells"],
        "cell_max_mv": [3641, "mV", "cells"],
        "cell_spread_mv": [29, "mV", "cells"],
        "range_km": [96, "km", "energy"],
        "coolant_in": [31.4, "°C", "coolant"],
        "coolant_out": [34.9, "°C", "coolant"],
        "odometer_can_km": [14849.4, "km", "drive"],
        "gps_speed_kmh": [0, "km/h", "gps"],
        "gps_altitude_m": [84, "m", "gps"],
        "gps_course_deg": [228, "°", "gps"],
        "gps_satellites": [11, "", "gps"],
        // A waypoint, so the Waypoints tile has something to draw in the preview.
        // Greenwich, deliberately: a coordinate everyone recognises as a fixture, and
        // one nobody can mistake for where this bike is kept. docs/route-map.md
        // §"No coordinates anywhere" is why it is not a real one.
        "waypoint_seq": [4, "", "waypoint", NOW - 6 * MINUTE],
        "waypoint_lat": [51.4779, "°", "waypoint", NOW - 6 * MINUTE],
        "waypoint_lon": [-0.0015, "°", "waypoint", NOW - 6 * MINUTE],
        // Two codes the bike is holding. 0044/0 is the water-pump open circuit — real,
        // and permanent on this bike, because the coolant pump is wired to the
        // heated-grip output and the VCU's own pump driver is left open.
        "dtc_0044_0": [1, "", "diag"],
        "dtc_0002_0": [1, "", "diag"],
        "dtc_count": [2, "", "diag"],
      };

      /**
       * Which bike this preview is standing in for, chosen with `?scene=` in the URL.
       *
       * ⚠️ A query string and not the hash: the hash is the app's tab router, and the preview
       * hands `location.hash` straight to it. A control on the page was the alternative and was
       * rejected — this file's claim is that what you see is what the bike serves, and chrome of
       * its own weakens that for every screenshot taken through it.
       *
       * Parked is the fixture this file has always shown, value for value, so a screenshot taken
       * before the scenes existed still matches. The other two exist because the panels added
       * over the last week — the DC set-current control, #176's stand-down, the power bar's
       * derate hatching — render NOTHING off a parked bike, and a design gate blind to the panel
       * it is gating is not a gate.
       */
      const SCENES = {
        parked: { signals: {} },
        dc: {
          // ⚠️ NOTHING from the onboard charger is here — no `charger_enabled`, no `charger_max_dc_*`,
          // no mains or dc_v/dc_a. lib/charge-mode.js records that every one of them logged exactly
          // zero readings across a measured 40-minute DC session, so a fixture broadcasting them as
          // permanently fresh describes a bike this software does not serve.
          //
          // ⚠️ `charge_manager_state` alone is NOT a DC session. It drives the AC/DC label and the
          // write controls' visibility (lib/charge-write.js), while lib/charge-mode.js — which the
          // delivery tile and the power bar's "claim nothing while charging" rule both read —
          // keys on `fast_dc_contactor`. Setting one without the other renders the set-current
          // control above a tile still saying "plug in to see delivery".
          signals: {
            "soc": [62, "%", "battery"],
            "pack_v": [358.4, "V", "battery"],
            "pack_a": [42.1, "A", "battery"],
            "pack_kw": [15.1, "kW", "battery"],
            "range_km": [103, "km", "energy"],
            "batt_temp_lo": [43, "°C", "battery"],
            "batt_temp_hi": [47, "°C", "battery"],
            "coolant_in": [34.8, "°C", "coolant"],
            "coolant_out": [38.2, "°C", "coolant"],
            "charge_manager_state": [0x23, "", "charge"],
            "fast_dc_contactor": [1, "", "charge"],
            "dc_charging": [1, "", "charge"],
            "bms_state_charge": [1, "", "bms"],
            "fast_dc_limit_max_a": [75, "A", "charge"],
            "fast_dc_limit_a": [42, "A", "charge"],
            "fast_dc_target_a": [42, "A", "charge"],
            "fast_dc_target_v": [372, "V", "charge"],
            "charge_cmd_a": [42, "A", "charge"],
            "charge_cmd_ack": [1, "", "charge"],
            "charge_cmd_ack_ms": [1840, "ms", "charge"],
            "charge_auto_mode": [1, "", "charge"],
            "charge_auto_target_a": [42, "A", "charge"],
            // The module heatmap, which renders NOTHING without these — the Charge tab
            // showed "waiting for 0x664" on every scene, so the dashboard gate could not
            // look at the tile it was gating.
            //
            // One real sample, 2026-08-08 11:00:00 UTC, taken as the last value of each
            // key at that instant. bat1 43-45, pcb 27-34, inside this scene's own
            // batt_temp_lo/hi of 43/47.
            //
            // ⚠️ There is deliberately no lmu6_bat1_c or lmu8_bat1_c, and there CANNOT
            // be: those two modules have BattTemp1Enabled=False, registry.ts declares no
            // such key, and check-preview-fixtures.ts resolves every key here against
            // SIGNALS — inventing one fails the suite rather than drawing a sensor.
            "lmu1_bat1_c": [43, "°C", "battery"],
            "lmu1_pcb1_c": [30, "°C", "battery"],
            "lmu1_pcb2_c": [29, "°C", "battery"],
            "lmu2_bat1_c": [44, "°C", "battery"],
            "lmu2_pcb1_c": [33, "°C", "battery"],
            "lmu2_pcb2_c": [33, "°C", "battery"],
            "lmu3_bat1_c": [43, "°C", "battery"],
            "lmu3_pcb1_c": [28, "°C", "battery"],
            "lmu3_pcb2_c": [28, "°C", "battery"],
            "lmu4_bat1_c": [45, "°C", "battery"],
            "lmu4_pcb1_c": [29, "°C", "battery"],
            "lmu4_pcb2_c": [29, "°C", "battery"],
            "lmu5_bat1_c": [44, "°C", "battery"],
            "lmu5_pcb1_c": [29, "°C", "battery"],
            "lmu5_pcb2_c": [29, "°C", "battery"],
            "lmu6_pcb1_c": [28, "°C", "battery"],
            "lmu6_pcb2_c": [28, "°C", "battery"],
            "lmu7_bat1_c": [44, "°C", "battery"],
            "lmu7_pcb1_c": [28, "°C", "battery"],
            "lmu7_pcb2_c": [28, "°C", "battery"],
            "lmu8_pcb1_c": [34, "°C", "battery"],
            "lmu8_pcb2_c": [33, "°C", "battery"],
            "lmu9_bat1_c": [45, "°C", "battery"],
            "lmu9_pcb1_c": [34, "°C", "battery"],
            "lmu9_pcb2_c": [33, "°C", "battery"],
            "lmu10_bat1_c": [44, "°C", "battery"],
            "lmu10_pcb1_c": [28, "°C", "battery"],
            "lmu10_pcb2_c": [27, "°C", "battery"],
            "lmu11_bat1_c": [43, "°C", "battery"],
            "lmu11_pcb1_c": [29, "°C", "battery"],
            "lmu11_pcb2_c": [29, "°C", "battery"],
          },
          // The stand-down #176 is about: the controller is still on, and standing back because
          // the rider set a current themselves. Its reason code and its sentence both come from
          // the Pi's own table rather than being written again here.
          chargeAutoReason: SERVER.chargeAutoReason.RIDER,
          commandedAmps: 42,
          // ⚠️ The gate's charging branch, which is deliberately NOT the stationary one: the DC
          // charge parameters cannot be tested unplugged, so a charging bike is allowed to write.
          // ⚠️ SERVER.chargingDcEvidence, not a typed copy of it. Until #190 this read
          // "…reports a DC session", which NO production code could emit for a fortnight — a
          // fixture quoting a caption the Pi cannot say is the failure #184 is about.
          gate: { chargingEvidence: SERVER.chargingDcEvidence },
          // Phrasing mirrors describeChargeAck()'s `took` branch in src/charge/acknowledge.ts.
          chargeAck: {
            verdict: { kind: "took", fromAmps: 68, toAmps: 42, latencyMs: 1840 },
            message: "Command took: request 68 → 42 A in 1.8 s.",
          },
          // 100 % for the whole of a DC session, whatever the pack temperature — src/fan/curve.ts.
          fan: { dutyPercent: 100, targetPercent: 100, driverEnabled: true, phase: "running" },
          fanAuto: { reason: SERVER.fanReason.DC_SESSION, temperatureInput: SERVER.fanTemperatureInput.LIVE, temperatureC: 47, temperatureAgeMs: 310 },
        },
        // Episode E0 (docs/vcu-parameters.md §12): the charge manager is on the bus with an
        // empty inlet, so the settled 0x02 is NOT believed. The two blockers are what
        // evaluateServiceGate emits, in its order — the cable leads and the drive follows.
        refused: {
          // ⚠️ BOTH bytes of 0x610, because the inlet byte is what the refusal is about and
          // the fixture used to display a verdict its own signals could not produce. 0x00 is
          // E0's own reading: no inlet, no lock. The Charge tab reading "live AC session"
          // beside "nothing in the inlet" is not a fixture bug — it is exactly the
          // contradiction episode E0 is, and the gate is the thing that resolves it.
          signals: {
            "charge_manager_state": [0x02, "", "charge"],
            "charge_manager_status": [0x00, "", "charge"],
          },
          gate: {
            safe: false,
            blockers: [SERVER.inletBlocker, "the drive is not energized — it reads 1"],
            chargingEvidence: null,
          },
        },
        riding: {
          // Both halves of the power bar hatch here, which is the case lib/svg.js's derateSpans()
          // and lib/power-limits.js exist for and which no parked fixture can reach: 210 A at
          // 340 V is 71 kW against the drive half's 130, and 55 A is 19 kW against regen's 36.
          // Drive is the NEGATIVE direction on pack_kw — the archive's deepest sample is −117.3.
          signals: {
            "soc": [46, "%", "battery"],
            "pack_v": [340.2, "V", "battery"],
            "pack_a": [-142, "A", "battery"],
            "pack_kw": [-48.3, "kW", "battery"],
            "range_km": [71, "km", "energy"],
            "allowed_discharge_a": [210, "A", "battery"],
            "allowed_regen_a": [55, "A", "battery"],
            "batt_temp_lo": [38, "°C", "battery"],
            "batt_temp_hi": [41, "°C", "battery"],
            "coolant_in": [36.5, "°C", "coolant"],
            "coolant_out": [41.2, "°C", "coolant"],
            "cell_min_mv": [3489, "mV", "cells"],
            "cell_max_mv": [3527, "mV", "cells"],
            "cell_spread_mv": [38, "mV", "cells"],
            "gps_speed_kmh": [72, "km/h", "gps"],
            "speed_can_kmh": [74, "km/h", "drive"],
            "gps_course_deg": [113, "°", "gps"],
            "motor_rpm": [4210, "rpm", "obd"],
            "throttle_pct": [34, "%", "drive"],
            "go": [1, "", "controls"],
          },
          // On the riding curve rather than the speed gate: that opens at 90 km/h and this is 72.
          fan: { dutyPercent: 62, targetPercent: 62, driverEnabled: true, phase: "running" },
          fanAuto: { reason: SERVER.fanReason.PACK_TEMPERATURE, temperatureInput: SERVER.fanTemperatureInput.LIVE, temperatureC: 41, temperatureAgeMs: 240 },
          funGate: SERVER.funGate.GO_SET,
          // ⚠️ A riding bike is the one state where the gate MUST refuse, and this scene had
          // no `gate` at all — harmless while the override reached only the write panel,
          // wrong the moment one binding fed all five fixtures. The blockers are the
          // sentences evaluateServiceGate builds for 74 km/h with the drive engaged.
          gate: {
            safe: false,
            blockers: [
              "road speed is zero — it reads 74.0",
              "the motor is not turning — it reads 4210",
              "the bike is not moving — it reads 1",
              "the bike is not in drive — it reads 1",
            ],
            chargingEvidence: null,
          },
        },
      };

      const WANTED_SCENE = new URLSearchParams(window.location.search).get("scene");
      // ⚠️ hasOwn, not a bare lookup: `?scene=constructor` would otherwise select a function.
      const SCENE_NAME = WANTED_SCENE !== null && Object.hasOwn(SCENES, WANTED_SCENE) ? WANTED_SCENE : "parked";
      if (WANTED_SCENE !== null && WANTED_SCENE !== SCENE_NAME) {
        console.warn(`preview: there is no scene called "${WANTED_SCENE}" — showing parked. Try ${Object.keys(SCENES).join(", ")}.`);
      }
      const SCENE = SCENES[SCENE_NAME];


      /** Everything the bike is broadcasting right now. Patches write here, so a snapshot carries them. */
      const LIVE = Object.assign({}, PARKED_SIGNALS, SCENE.signals);

      /**
       * What the cooling fan is doing, in the shape src/http/fan.ts answers with.
       *
       * `limits` is the endpoint's OWN fanLimits() — nine constants src/fan/curve.ts owns, injected
       * at build time rather than copied here, because a preview quoting a threshold this Pi does
       * not use is exactly the drift the rest of this file is about.
       */
      const FAN = {
        dutyPercent: 0,
        targetPercent: 0,
        driverEnabled: false,
        phase: "idle",
        mode: "automatic",
        // Parked, this fixture broadcasts no pack temperature, so the honest automatic state is
        // the one with nothing to decide on rather than an invented reading.
        auto: {
          reason: SERVER.fanReason.NO_READING_YET,
          temperatureInput: SERVER.fanTemperatureInput.NONE,
          temperatureC: null,
          temperatureAgeMs: 4200,
        },
        // Never available in the preview: fun mode needs a live throttle and a bike that cannot
        // move, and claiming it would offer a control that commands nothing.
        fun: { available: false, gate: SERVER.funGate.GO_UNKNOWN },
        fault: null,
        limits: SERVER.fanLimits,
        message: null,
      };

      /**
       * The controller's reply, derived from its state exactly as src/http/charge-auto.ts's
       * respond() derives it — the reason's sentence and the floor are not independent facts.
       * One function, because the three places that used to do this by hand were the initial
       * fixture, the scene overlay and the POST handler, and only the first was type-checked.
       */
      function chargeAutoReply(state, message = null) {
        return {
          state,
          reasonText: SERVER.chargeAutoReasonText[state.reason] ?? "",
          floorAmps: SERVER.chargeAutoFloorAmps,
          message,
        };
      }

      /**
       * The automatic charge-current controller, in the shape src/http/charge-auto.ts answers with.
       *
       * ⚠️ Written out rather than built by chargeAutoReply() above, and the reason is the check:
       * scripts/check-preview-fixtures.ts type-checks fixture LITERALS, so a fixture assembled by a
       * call is a fixture it cannot see. This is the copy that is checked; the function is for the
       * two derivations that happen on a tap, which are the ones that used to be unchecked.
       */
      const CHARGE_AUTO = {
        state: { mode: "off", reason: SERVER.chargeAutoReason.NOT_DC, commandedAmps: null },
        reasonText: SERVER.chargeAutoReasonText[SERVER.chargeAutoReason.NOT_DC],
        floorAmps: SERVER.chargeAutoFloorAmps,
        message: null,
      };

      // The scene's own answers, laid over the fixtures above. Kept here rather than written into
      // each fixture so the literals stay complete — scripts/check-preview-fixtures.ts reads THEM,
      // and a fixture assembled per scene would be a fixture it could no longer check.
      Object.assign(GATE, SCENE.gate);
      Object.assign(FAN, SCENE.fan);
      Object.assign(FAN.auto, SCENE.fanAuto);
      if (SCENE.funGate !== undefined) {
        FAN.fun.gate = SCENE.funGate;
      }
      if (SCENE.chargeAck !== undefined) {
        WRITE_STATUS.chargeAck = SCENE.chargeAck;
      }
      if (SCENE.chargeAutoReason !== undefined) {
        Object.assign(
          CHARGE_AUTO,
          chargeAutoReply({
            mode: "automatic",
            reason: SCENE.chargeAutoReason,
            commandedAmps: SCENE.commandedAmps ?? null,
          })
        );
      }

      // The fan broadcasts as well as answering, and the sheet reads the BROADCAST for what it is
      // doing right now ("the reply is only as fresh as the fetch" — views/fan.js). Derived from
      // the reply rather than written a second time in the scene, so the two cannot disagree:
      // without these the section rendered "the fan driver has not reported yet" over a live one.
      //
      // ⚠️ ALL of them, every time. Patching only the three the slider moves left the toggle on
      // Auto and the reason line saying the curve was commanding a duty the rider had just typed.
      function fanReadings() {
        return {
          fan_duty_pct: [FAN.dutyPercent, "%", "fan"],
          fan_target_pct: [FAN.targetPercent, "%", "fan"],
          fan_driver_enabled: [FAN.driverEnabled ? 1 : 0, "", "fan"],
          fan_auto_mode: [SERVER.fanModeCode[FAN.mode], "", "fan"],
          fan_auto_reason: [FAN.auto.reason, "", "fan"],
          fan_temp_input: [FAN.auto.temperatureInput, "", "fan"],
          fan_fun_available: [FAN.fun.available ? 1 : 0, "", "fan"],
          fan_fun_gate: [FAN.fun.gate, "", "fan"],
        };
      }

      // What the curve was doing when this scene was loaded, kept so switching back to automatic
      // restores it rather than leaving the slider's answer behind. ⚠️ Only the fields the restore
      // reads: `{ ...FAN }` would carry an `auto` that is the SAME OBJECT the slider mutates, so
      // the obvious `Object.assign(FAN.auto, SCENE_FAN.auto)` would be a silent no-op.
      const SCENE_FAN = {
        dutyPercent: FAN.dutyPercent,
        targetPercent: FAN.targetPercent,
        driverEnabled: FAN.driverEnabled,
        phase: FAN.phase,
      };
      const SCENE_FAN_AUTO = { ...FAN.auto };

      Object.assign(LIVE, fanReadings());

      /** One WebSocket message, in the shape src/ws.ts broadcasts. */
      function message(type, readings) {
        const at = Date.now();
        const signals = {};
        for (const [key, reading] of Object.entries(readings)) {
          signals[key] = { value: reading[0], unit: reading[1], group: reading[2], ts: reading[3] ?? at };
        }
        return { type, ts: at, signals };
      }

      // ── the Pi, stubbed ──────────────────────────────────────────────────────────

      /**
       * A Response, near enough.
       *
       * ⚠️ It deep-copies, and that is load-bearing rather than tidiness. A real `json()`
       * parses the body afresh every time, so the dashboard gets a NEW object per response
       * — and VanJS only re-renders when a state is set to something `!==` what it held
       * (van-1.6.1.js's `set val`). Handing back the same mutated object left the sweep's
       * progress line advancing (it is also paced by a tick) while the button above it
       * stayed on "Stop the parameter read" forever, which would have looked like a bug in
       * the sheet and is not one.
       */
      function json(body, status = 200) {
        const text = JSON.stringify(body);
        return Promise.resolve({
          ok: status >= 200 && status < 300,
          status,
          json: () => Promise.resolve(JSON.parse(text)),
          text: () => Promise.resolve(text),
        });
      }

      /** Advances a sweep started from the preview, one poll at a time. */
      function stepSweep() {
        const run = READ_STATE.run;
        if (run.phase !== "running") {
          return;
        }
        const read = Math.min(run.tally.total, run.tally.read + 19);
        run.tally.read = read;
        run.tally.byStatus.read = read;
        run.tally.micros[0].read = Math.min(223, Math.round(read * 0.86));
        run.tally.micros[1].read = read - run.tally.micros[0].read;
        if (read >= run.tally.total - 44) {
          run.phase = "finished";
          run.complete = true;
          run.finishedAt = Date.now();
          // ⚠️ `expected` belongs to the RUNNING arm alone, so a sweep that finishes must lose it
          // rather than carry it over — the Pi builds a fresh state per phase (readState()), and a
          // check that reads the literal cannot see a field re-added out here.
          delete run.expected;
          run.tally.read = 233;
          run.tally.byStatus.read = 233;
          run.tally.micros = [
            { micro: "A9", read: 201, failed: 22 },
            { micro: "A8", read: 32, failed: 22 },
          ];
          READ_STATE.export = { rows: 233, readAt: Date.now(), complete: true };
        }
      }

      function serviceWrite(query) {
        const action = query.get("action");
        const record = extra => {
          JOURNAL.unshift(Object.assign({ at: Date.now(), clockTrustworthy: true }, extra));
          JOURNAL.length = Math.min(JOURNAL.length, 6);
        };

        if (action === "read-service-stamp") {
          // ⚠️ The fixture is what the bike REALLY answered on 2026-09-08, message, journal
          // and raw words together. A plausible-looking 2024 date beside a zero stamp would
          // make the preview disagree with itself in the one screenshot this exists for.
          record({
            action: "read-service-stamp",
            status: "read",
            before: "2000-01-01T00:00:00.000Z",
            after: 0,
            rawHex: "13E8=0000 13E9=0000 13EA=0000 13EB=0000",
          });
          return {
            action: "read-service-stamp",
            status: "read",
            message:
              "Last service stamped 2000-01-01T00:00:00.000Z at 0 (km or miles, per market). " +
              "\u26a0\ufe0f reads zero — no service point has ever been set on this bike, or A8 answered with an empty cell",
            succeeded: true,
            stamp: {
              // The 2026-09-08 payload, as A8 really answered: four zero WORDs.
              // docs/service-stamp.md §2.
              before: {
                raw: { dateLow: 0, dateHigh: 0, odometerLow: 0, odometerHigh: 0 },
                dateSeconds: 0,
                dateIso: "2000-01-01T00:00:00.000Z",
                odometer: 0,
                implausible:
                  "reads zero — no service point has ever been set on this bike, or A8 answered with an empty cell",
              },
              after: null,
            },
          };
        }
        if (action === "set-service-point") {
          // Over the zero stamp the read above reports — the same fixture, one action later.
          record({
            action: "set-service-point",
            status: "started",
            before: "2000-01-01T00:00:00.000Z",
            after: "2026-09-08",
          });
          return {
            action: "set-service-point",
            status: "started",
            message:
              "Service point set. The bike stamped 2026-09-08T12:17:06.000Z at 14849, over " +
              "2000-01-01T00:00:00.000Z at 0.",
            succeeded: true,
          };
        }
        if (action === "clear-dtcs") {
          record({ action: "clear-dtcs", status: "cleared" });
          return {
            action: "clear-dtcs",
            status: "cleared",
            message:
              "Mode 04 accepted. The stored list is gone; codes whose faults are still active will come back on the next drive cycle. Read the list again to see what remains.",
            succeeded: true,
          };
        }
        if (action === "sync-clock") {
          const when = new Date().toISOString();
          record({ action: "rtc-sync", status: "sent", requested: when, after: null });
          return {
            action: "rtc-sync",
            status: "sent",
            message:
              `Broadcast ${when} UTC on 0x120 (120#07E00813 0E1A0000). ` +
              "⚠️ CHECK THE DASHBOARD NOW to see whether the bike took it. " +
              "There is no reply to this frame and no documented way to read the bike's clock back, so the dash is the only " +
              "confirmation that exists. Note the bike was sent UTC, so a dash showing local time will differ by your offset. " +
              "Confirm it before using Set Service Point, which stamps whatever the bike's clock says.",
            succeeded: true,
          };
        }
        if (action === "parameter" || action === "bit") {
          const name = query.get("name");
          const target = TARGETS.find(candidate => candidate.name === name);
          if (!target) {
            return null;
          }
          let value;
          let description;
          if (action === "bit") {
            const on = query.get("on") === "1";
            const bit = target.control.bits[0];
            value = on ? target.onBike.value | bit.mask : target.onBike.value & ~bit.mask;
            description = `${name} ${bit.label} → ${on ? "ON" : "OFF"}`;
          } else {
            value = Number(query.get("value"));
            description = `${name} ${query.get("expected")} → ${value}`;
          }
          const rawHex = value.toString(16).toUpperCase().padStart(target.onBike.rawHex.length, "0");
          // The write lands, and the sweep's snapshot is updated with it — so the form goes
          // on telling the truth about what the bike holds.
          target.onBike = { value, rawHex, label: null, readAt: Date.now(), complete: true };
          record({
            action: "parameter-write",
            status: "written",
            name,
            before: Number(query.get("expected")),
            after: value,
          });
          return {
            action: "parameter-write",
            status: "written",
            message: `${description} — written and read back as ${value} (${rawHex}).`,
            succeeded: true,
            onBike: { name, value, rawHex },
          };
        }
        return null;
      }

      /**
       * What a fan command does to the driver's state.
       *
       * ⚠️ The query spelling is NOT the mode. views/fan.js sends `mode=auto`, and `FanMode` holds
       * "automatic" — src/http/fan.ts's parseFanRequest() maps it, and accepts "play" for fun for
       * the same reason. Storing the raw word put a value in the reply that the type cannot hold,
       * and it stayed there for every later GET.
       */
      function commandFan(query) {
        const duty = query.get("duty");
        const mode = query.get("mode");
        if (duty !== null && mode !== null) {
          FAN.message = "pass duty=<percent> OR mode=auto|manual|fun, not both — a duty already means manual";
          return 400;
        }
        if (duty !== null) {
          const percent = Number(duty);
          FAN.mode = "manual";
          FAN.dutyPercent = percent;
          FAN.targetPercent = percent;
          FAN.driverEnabled = percent > 0;
          FAN.phase = percent > 0 ? "running" : "idle";
          FAN.auto.reason = SERVER.fanReason.MANUAL;
          FAN.message = null;
          return 200;
        }
        const wanted = { auto: "automatic", automatic: "automatic", manual: "manual", fun: "fun", play: "fun" }[
          (mode ?? "").trim().toLowerCase()
        ];
        if (wanted === undefined) {
          FAN.message = `mode must be auto, manual or fun, not ${mode}`;
          return 400;
        }
        if (wanted === "fun") {
          // The gate the Pi applies, and the preview cannot pass it: fun mode needs a live throttle.
          // 503 rather than 400, as src/http/fan.ts does: the request was fine, the bike is not.
          FAN.message = "The bike has to be parked and its throttle readable before the fan will follow it.";
          return 503;
        }
        FAN.mode = wanted;
        // Handing the fan back to the curve restores the decision this scene's curve would make.
        // Leaving MANUAL there would show an automatic fan reporting that the slider is driving it,
        // which is a pair of lines the Pi cannot produce together.
        if (wanted === "automatic") {
          Object.assign(FAN, SCENE_FAN);
          Object.assign(FAN.auto, SCENE_FAN_AUTO);
        }
        FAN.message = null;
        return 200;
      }

      window.fetch = function previewFetch(input, init) {
        const request = typeof input === "string" ? input : input && input.url ? input.url : String(input);
        const url = new URL(request, "http://eva.local/");
        const method = ((init && init.method) || "GET").toUpperCase();
        const path = url.pathname;

        if (path === "/status") {
          return json(STATUS);
        }
        if (path === "/waypoint") {
          STATUS.waypoints += 1;
          // The three signals go out too, because that is what the bike does: record()
          // writes them and ws.ts patches them to every client. Without this the preview
          // shows a permanently half-saved waypoint — the button's note claiming a save
          // the Waypoints tile above it has never been told about.
          // Stamped with the moment of the save and holding it, because that is the time the
          // Waypoints tile prints — the Pi's record() only touches these three when one is saved.
          const savedAt = Date.now();
          pushPatch({
            waypoint_seq: [STATUS.waypoints, "", "waypoint", savedAt],
            waypoint_lat: [51.4779, "°", "waypoint", savedAt],
            waypoint_lon: [-0.0015, "°", "waypoint", savedAt],
          });
          return json({
            saved: true,
            message: `Waypoint ${STATUS.waypoints} saved — 57.0000, 12.0000, 11 satellites.`,
          });
        }
        if (path === "/update") {
          // A FAILED pull, deliberately: it is the reply that exercises all three of the
          // note's claims at once — the newlines survive (white-space: pre-wrap), the long
          // URL wraps instead of widening the sheet (overflow-wrap: anywhere), and `ok:
          // false` paints it as a failure rather than in the same grey as a success.
          return json({
            ok: false,
            message:
              "Stopped after 60 s — bad wifi, or a remote that never answered.\n\n" +
              "remote: Enumerating objects: 41, done.\n" +
              "fatal: unable to access 'https://github.com/danieltroger/cool-eva.git/': " +
              "Failed to connect to github.com port 443 after 60000 ms: Couldn't connect to server",
          });
        }
        // ⚠️ The fan and the charge controller HOLD what a command did, rather than answering with
        // the fixture every time. views/fan.js adopts the reply into its own states, so a constant
        // one springs the slider back to the fixture's duty on every drag; views/charge-auto.js
        // does the same, so the button would still read "Take the current back" after the tap that
        // exists to demonstrate it. A preview that undoes the gesture being reviewed is worse than
        // no preview of it.
        if (path === "/fan") {
          if (method !== "POST") {
            return json(FAN);
          }
          // ⚠️ The STATUS the Pi would answer with, not a blanket 200: refreshFanStatus() and the
          // command queue both branch on `response.ok`, so a stub that says 200 to a request the
          // service refuses is a preview of a door that is not there.
          const status = commandFan(url.searchParams);
          pushPatch(fanReadings());
          return json(FAN, status);
        }
        if (path === "/charge-auto") {
          if (method === "POST") {
            const mode = url.searchParams.get("mode");
            // `mode=automatic` is what clears a stand-down on the Pi too (src/charge/auto.ts), which
            // is the whole of why #176's third button state is one tap and not two.
            Object.assign(
              CHARGE_AUTO,
              chargeAutoReply({
                mode: mode === "automatic" ? "automatic" : "off",
                reason: mode === "automatic" ? SERVER.chargeAutoReason.SETTLED : SERVER.chargeAutoReason.DISABLED,
                commandedAmps: mode === "automatic" ? CHARGE_AUTO.state.commandedAmps : null,
              })
            );
            pushPatch({ charge_auto_reason: [CHARGE_AUTO.state.reason, "", "charge"] });
          }
          return json(CHARGE_AUTO);
        }
        if (path === "/can-restart") {
          // POST-only on the Pi, so that a prefetch or a crawler cannot re-initialise the bus by
          // following a link (src/http/can-restart.ts). The stub keeps the same door.
          if (method !== "POST") {
            return json({ ok: false, message: "POST to restart the CAN bus" });
          }
          toast("Preview — nothing was sent. A Pi would have re-run the two ip link commands.");
          return json({ ok: true, message: "can0 restarted at 500 kbit/s." });
        }
        if (path === "/lifetime-read") {
          if (method !== "POST") {
            // GET /lifetime-stats serves the stored reading; this path only ever reads the bike.
            return json({ ...LIFETIME_READ, measurement: null, answered: null, message: "use POST" }, 405);
          }
          toast("Preview — nothing was sent. A Pi would have opened a diagnostic session on 51 and 52.");
          return json(LIFETIME_READ);
        }
        if (path === "/vcu-read") {
          if (method === "POST") {
            READ_STATE.run = {
              phase: "running",
              startedAt: Date.now(),
              finishedAt: null,
              complete: false,
              expected: 277,
              tally: {
                total: 277,
                read: 0,
                byStatus: { "read": 0, "refused": 0, "no-response": 0, "no-session": 0, "multi-frame": 0, "unrecognised": 0, "not-sent": 0 },
                micros: [
                  { micro: "A9", read: 0, failed: 0 },
                  { micro: "A8", read: 0, failed: 0 },
                ],
              },
            };
            READ_STATE.message = "Started. Nothing here blocks — the sweep runs on the Pi.";
          } else if (method === "DELETE") {
            READ_STATE.run.phase = "finished";
            READ_STATE.run.complete = false;
            READ_STATE.message = "Stopped on request.";
          } else {
            stepSweep();
            READ_STATE.message = null;
          }
          return json(READ_STATE);
        }
        if (path === "/vcu-probe") {
          const index = Number(url.searchParams.get("index"));
          const target = TARGETS.find(candidate => candidate.index === index);
          if (!target) {
            return json({
              reading: {
                status: "read",
                // ⚠️ Narrowed to a real VcuTarget rather than echoed: searchParams.get() is
                // `string | null`, and the Pi's reply cannot name a micro it cannot address.
                target: url.searchParams.get("target") === "A8" ? "A8" : "A9",
                bank: Number(url.searchParams.get("bank")),
                index,
                identifier: (Number(url.searchParams.get("bank")) << 12) | index,
                rawHex: "01F4",
                unsigned: 500,
                signed: 500,
                value: null,
                name: null,
                // Null for the same reason `name` is: the name table describes bank 1 alone.
                section: null,
                note: "No name-table row describes this identifier, so only the bytes are known.",
              },
              message: null,
              gate: GATE,
              targets: [],
            });
          }
          return json({
            reading: {
              status: "read",
              target: target.micro,
              bank: 1,
              index: target.index,
              identifier: 0x1000 | target.index,
              rawHex: target.onBike.rawHex,
              unsigned: target.onBike.value,
              signed: target.onBike.value,
              value: target.onBike.value,
              name: target.name,
              section: "EVSE",
              note: null,
            },
            message: null,
            gate: GATE,
            targets: [],
          });
        }
        if (path === "/vcu-write") {
          if (method !== "POST") {
            return json({ status: WRITE_STATUS, result: null, message: null });
          }
          const result = serviceWrite(url.searchParams);
          // The full-sheet panel renders the answer under the button, the way the bike would.
          // The close-ups below it do not — they are one block of the section — so the answer
          // is also said here, marked as the preview talking rather than the motorcycle.
          if (result) {
            const said = result.message.length > 150 ? `${result.message.slice(0, 147)}…` : result.message;
            toast(`Preview — nothing was sent. A Pi would have answered: ${said}`);
          }
          return json({
            status: WRITE_STATUS,
            result,
            message: result ? null : "The preview does not carry that action.",
          });
        }
        // Tables, generated from the repo's own source at build time. Serving a
        // hand-written copy here would make the Faults tab call this bike's own
        // P0A07 "not in Energica's code table", which it plainly is.
        if (__TABLES[path]) {
          return json(__TABLES[path]);
        }
        // Bike STATE, not a table — and these must match their real response CONTRACTS,
        // not merely be "empty". ⚠️ A first attempt returned {readAt, codes: []}, which
        // threw ten TypeErrors per load (faults.js reads snapshot.stored.state) and, worse,
        // `codes: []` is the shape reserved for "the bike answered with zero codes". That is
        // the invented answer `not-asked` exists to prevent — its own comment in
        // src/diagnostics/stored-codes.ts says folding it into no-response would be
        // "exactly the kind of invented answer this file exists to avoid". Rejecting, as the
        // old stub did, was strictly better than answering in the wrong shape.
        if (path === "/stored-dtcs") {
          const notAsked = { state: "not-asked", reason: "preview — no bike behind this page" };
          return json({
            stored: notAsked,
            pending: notAsked,
            permanent: notAsked,
            freezeFrame: null,
            readAt: null,
            ageMs: null,
          });
        }
        if (path === "/vcu-params") {
          // The real union is {state: "never-read" | "snapshot" | "unreadable"}.
          return json({
            state: "never-read",
            directory: "(preview)",
            hint: "no sweep has run on this Pi — there is no bike behind this page",
          });
        }
        if (/^https?:/.test(request)) {
          // Deliberately NOT passed to the real fetch. This file is published as a
          // shareable artifact under a CSP that blocks external hosts, so a passthrough
          // is not "works when online" — it is a silent failure with no stub behind it.
          return json({ error: "preview: external requests are not made", url: request });
        }
        return Promise.reject(new Error(`preview: nothing serves ${path}`));
      };

      /** The socket the page is holding, so a stubbed action can patch it as the Pi would. */
      let liveSocket = null;

      /**
       * One patch to the page, in the shape src/ws.ts broadcasts.
       *
       * ⚠️ Written into LIVE first. Without that the next snapshot re-sent the fixture's own
       * constant over the top: tapping "Save waypoint here" moved the tile to #5 and the
       * reconnect a few seconds later put it back to #4, which is a preview undoing the one
       * thing the tester just did.
       */
      function pushPatch(readings) {
        Object.assign(LIVE, readings);
        // Through deliver(), so a patch cannot reach a socket the page has already closed — the
        // guard the heartbeat below carries, which this used to go around.
        if (liveSocket) {
          liveSocket.deliver(message("patch", readings));
        }
      }

      /**
       * The Pi's end of the WebSocket: a snapshot on connect, and one every HEARTBEAT_MS after.
       *
       * ⚠️ The heartbeat is not decoration. It is what src/ws.ts does, and lib/connection.js
       * declares a link dead after SILENCE_LIMIT_MS of quiet — so a stub that sent one snapshot
       * and stopped had the header flapping live → offline → live for ever, and isStaleWith()
       * calls EVERY signal stale while the link is down. Measured on the old fixture: the page
       * read `offline` in 20 of 60 samples, with dimmed tiles in exactly those 20. One screenshot
       * in three off the instrument this project gates dashboard merges with was a photograph of
       * a dropout. It is also what keeps the DC scene mounted at all: lib/charge-write.js drops
       * the whole charge control set when charge_manager_state ages past 12 s.
       */
      window.WebSocket = class PreviewWebSocket {
        constructor(url) {
          this.url = url;
          this.readyState = 1;
          liveSocket = this;
          this.beat = setInterval(() => this.deliver(message("snapshot", LIVE)), SERVER.heartbeatMs);
          queueMicrotask(() => {
            if (this.onopen) {
              this.onopen();
            }
            this.deliver(message("snapshot", LIVE));
          });
        }
        deliver(payload) {
          if (this.readyState === 1 && this.onmessage) {
            this.onmessage({ data: JSON.stringify(payload) });
          }
        }
        send() {}
        close() {
          // A real socket's close event is asynchronous, and connection.js schedules the next
          // connection off it — firing it inside close() would reconnect from inside the teardown.
          clearInterval(this.beat);
          this.readyState = 3;
          queueMicrotask(() => {
            if (this.onclose) {
              this.onclose();
            }
          });
        }
        addEventListener() {}
        removeEventListener() {}
      };

      // ── one instance of the dashboard per panel ──────────────────────────────────
      //
      // views/vcu-write.js keeps `dangerOpen`, `armed`, `wanted` and the rest as
      // module-level van states. Two panels sharing one instance would share the fold and
      // the armed button — so each panel gets the whole module graph to itself.

      function instantiate() {
        const cache = Object.create(null);
        function imp(path) {
          const existing = cache[path];
          if (existing) {
            return existing;
          }
          const exports = (cache[path] = {});
          const factory = __MODULES[path];
          if (!factory) {
            throw new Error(`preview: no module ${path}`);
          }
          factory(exports, imp);
          return exports;
        }
        return imp;
      }

      /** Seeds the store from one WebSocket snapshot, then walks a finished ride past the trip counters. */
      async function seed(imp) {
        const store = imp("lib/store.js");
        const trip = imp("lib/trip.js");

        // ⚠️ It does NOT call store.connect(). app.js does that when it is imported below, and
        // connect() is not idempotent — a second call built a second link over a second socket,
        // so the store applied every heartbeat TWICE, for ever, and the first socket's interval
        // kept a connection the page could no longer see alive with it. Harmless before the
        // heartbeat existed, since a stub that sent one snapshot and stopped simply went quiet.
        // The bike holds one link; so does this. The walk below needs no socket: it writes the
        // two signals it reads.

        // 37.4 km in 41 minutes, which is what the last ride was. updateTrip() credits at
        // most two seconds per call — the guard that stops a backgrounded tab claiming its
        // whole absence as riding time — so the ride is walked past it at its own pace.
        const odometer = store.signalState("odometer_can_km");
        const speed = store.signalState("gps_speed_kmh");
        const start = 14849.4 - 37.4;
        const steps = 1230;
        odometer.val = { value: start, unit: "km", group: "drive", ts: NOW };
        speed.val = { value: 0, unit: "km/h", group: "gps", ts: NOW };
        trip.updateTrip(0);
        for (let step = 1; step <= steps; step++) {
          const fraction = step / steps;
          odometer.val = { value: start + 37.4 * fraction, unit: "km", group: "drive", ts: NOW };
          // A shape rather than a constant, so "Top" is a speed the bike actually reached
          // on the way rather than the average with a digit changed.
          const kmh = 46 + 34 * Math.sin(fraction * Math.PI * 3) + (step === 812 ? 42 : 0);
          speed.val = { value: Math.max(4, kmh), unit: "km/h", group: "gps", ts: NOW };
          trip.updateTrip(step * 2000);
        }
        odometer.val = { value: 14849.4, unit: "km", group: "drive", ts: NOW };
        speed.val = { value: 0, unit: "km/h", group: "gps", ts: NOW };
      }


      // The real entry point. public/app.js mounts itself into document.body on
      // import, exactly as it does behind index.html, so there is nothing to call.
      (async () => {
        const imp = instantiate();
        await seed(imp);
        imp("app.js");
        document.documentElement.dataset.previewReady = "yes";
      })();
    </script>
  </body>
</html>
